<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#111118" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		<!-- Fonts: v4 type, self-hosted (@modfolio/fonts, family B) — preloads and the
		     content-hashed stylesheet are emitted by +layout.svelte from
		     $lib/fonts-href. The Typekit kit and the jsDelivr "Pretendard Variable"
		     sheet were render-blocking and referenced by no token — removed. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
