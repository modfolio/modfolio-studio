<!doctype html>
<html lang="ko">
	<head>
		<!-- v4 type — self-host. @font-face 는 fonts.css(생성물,
		     modfolio-fonts/scripts/webfont.mjs). 종전 토큰은 Adobe Typekit 얼굴을
		     이름 짓고 있었다 — kit 없이 이름만 있으면 조용히 시스템 폰트로 떨어진다. -->
		<link rel="stylesheet" href="/fonts.css" />

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#111118" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		<!-- Adobe Fonts — Studio Kit (Cinematic Contrast) -->
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="stylesheet" href="https://use.typekit.net/glw6csk.css" />

		<!-- Pretendard Variable (Korean fallback) -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
